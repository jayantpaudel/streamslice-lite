name: Publish reviewed enhancement and verify
on:
  push:
    branches: [main]
    paths: [.github/workflows/sync-reviewed-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Verify base revision and reviewed source checksum
        shell: python
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          import hashlib,io,os,pathlib,subprocess,urllib.request,zipfile
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          if head!=os.environ['EXPECTED_HEAD'] or parent!='21173b81a7861a33327a1baa4af8e12f56f8b415':
              raise SystemExit('Repository moved: refusing to overwrite unrelated changes')
          expected='668feac3217e89167ae27c65061a9632bc1f678196177fc1b6217c6ee3a09426'
          with urllib.request.urlopen('https://backend.composio.dev/api/v3/sl/dhgabazd-F',timeout=60) as response:
              data=response.read(2*1024*1024+1)
          if len(data)>2*1024*1024 or hashlib.sha256(data).hexdigest()!=expected:
              raise SystemExit('Source checksum/size mismatch; no files modified')
          allowed={'.cargo/config.toml','.gitignore','Cargo.lock','Cargo.toml','LICENSE','README.md','ROADMAP.md','VALIDATION.md','scripts/licenses.py','scripts/smoke.py','src/ai.rs','src/main.rs','src/media.rs','src/setup.rs','src/vault.rs','ui/index.html'}
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              if set(archive.namelist())!=allowed or sum(x.file_size for x in archive.infolist())>2*1024*1024:
                  raise SystemExit('Unexpected paths or size')
              for item in archive.infolist():
                  path=pathlib.Path(item.filename)
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(archive.read(item))
          path=pathlib.Path('SOURCE-PROVENANCE.txt')
          path.write_text(path.read_text()+'Reviewed credential-storage enhancement SHA-256: '+expected+'\n')
      - name: Commit reviewed application files without rewriting history
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src ui scripts .cargo Cargo.toml LICENSE README.md ROADMAP.md VALIDATION.md .gitignore SOURCE-PROVENANCE.txt
          git add --force Cargo.lock
          git commit -m 'Add optional Windows credential storage and restart/privacy regression tests'
          git push origin HEAD:main
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: publish
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.publish.outputs.revision }}
    permissions:
      contents: read
